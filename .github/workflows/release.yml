# A tag produces a release: five platforms' binaries, their checksums, a
# .deb, the npm packages behind `npx gh-pr-manager@latest`, a Homebrew
# formula, and a changelog built from the commit subjects since the last tag.
#
# Ported from opscope's release.yml. Nothing here rewrites the source it is
# building. The version in Cargo.toml and the tag are checked against each
# other and the build stops if they disagree, rather than the workflow
# editing the manifest to make them match - a build that edits its own
# source produces a binary no checkout can reproduce. release-pr.yml does
# the bump, in a real commit, before the tag exists.
name: release

on:
  push:
    tags: ['v*']
  # Two uses. Dispatching at a branch exercises the whole build without
  # cutting a release, because the publish job is gated on the ref being a
  # tag. Dispatching at a tag does publish, and is how tag-release.yml
  # starts this workflow: a tag it pushes with GITHUB_TOKEN triggers
  # nothing, and workflow_dispatch is the documented exception.
  workflow_dispatch:
  # And on any change to the release machinery itself, because the first
  # time a release build runs should not be the release.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'cliff.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.cargo/**'
      - 'homebrew/**'
      - 'debian/**'
      - 'npm/**'

permissions:
  # PR builds and post-release smoke tests only need read access.
  # The tag-only publish job grants its own write permissions.
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      # Every platform reports, rather than the first failure hiding the
      # others.
      fail-fast: false
      matrix:
        include:
          # Pinned, not `-latest`. The oldest glibc a binary runs on is the
          # one it was built against, so that is a decision rather than
          # something to inherit from whatever the runner image became this
          # month. 22.04 is glibc 2.35 (npm/platform.js MIN_GLIBC).
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-22.04
          # A native arm64 runner (free on public repositories), so the
          # arm64 binary is tested, not only cross-compiled. Same glibc.
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-22.04-arm
          # Both macOS arches on one Apple Silicon runner, as opscope does:
          # macos-13 (Intel) is retired and its replacements bill even on a
          # public repository. Apple's toolchain cross-compiles x86_64; it
          # cannot run the result, so `cross: true` skips that leg's tests
          # and run check. The same sources are tested on the arm64 leg.
          - target: aarch64-apple-darwin
            runs-on: macos-15
          - target: x86_64-apple-darwin
            runs-on: macos-15
            cross: true
          - target: x86_64-pc-windows-msvc
            runs-on: windows-2022
            exe: .exe
    env:
      BIN: gh-pr-manager${{ matrix.exe }}
      # aws-lc-sys (rustls's crypto) needs NASM for x86_64 Windows, which the
      # runner does not have; its prebuilt objects are the documented
      # alternative. Ignored on every other target.
      AWS_LC_SYS_PREBUILT_NASM: "1"
    defaults:
      run:
        shell: bash
    steps:
      # Pinned to a commit, not a tag: a tag is mutable, and re-running this
      # workflow on the same release tag must execute the same action code.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The build stamps the commit and its date into --version. A
          # shallow clone still has those, but the changelog needs tags.
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          # An exact version: `stable` moves, and two builds of one tag
          # compiled by different compilers are two different binaries
          # wearing one version number.
          toolchain: "1.98.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: The tag and the manifest must agree
        # Only meaningful on a tag; a dispatch at a branch has no version.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tag" != "$manifest" ]; then
            echo "tag v$tag but Cargo.toml says $manifest" >&2
            echo "release-pr.yml bumps the manifest in a commit, and" >&2
            echo "tag-release.yml tags that commit, rather than having" >&2
            echo "this workflow rewrite the source it is building" >&2
            exit 1
          fi
          echo "v$tag"

      - name: Tests
        if: ${{ !matrix.cross }}
        run: cargo test --release --locked --target ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Nothing dynamic beyond the system runtime
        run: |
          # rustls, not OpenSSL, so the binary needs nothing installed
          # beside it. Checked rather than asserted: a crate that starts
          # wanting a system library (libssl is the usual one) would
          # otherwise ship quietly and fail on a clean machine.
          b="target/${{ matrix.target }}/release/$BIN"
          case "${{ runner.os }}" in
            Linux)
              leaked=$(ldd "$b" | grep -vE 'linux-vdso|libc\.so|libm\.so|libgcc_s\.so|ld-linux' \
                | grep -v '^[[:space:]]*$' || true) ;;
            macOS)
              # By location: everything under /usr/lib and /System/Library
              # ships with macOS. A Homebrew dylib is what must never appear.
              leaked=$(otool -L "$b" | tail -n +2 \
                | grep -vE '^\s*/usr/lib/|^\s*/System/Library/' \
                | grep -v '^[[:space:]]*$' || true) ;;
            Windows)
              # .cargo/config.toml links the C runtime statically. Without
              # it the binary imports these, and fails to start on a machine
              # without the Visual C++ Redistributable.
              leaked=$(grep -aoiE 'vcruntime[0-9]+\.dll|msvcp[0-9]+\.dll|api-ms-win-crt-[a-z0-9-]+\.dll' "$b" \
                | sort -u || true) ;;
          esac
          if [ -n "$leaked" ]; then
            # stdout as well as stderr: reading a failed job's log is what
            # the person who has to fix it will do first.
            echo "$BIN links something it should carry:"
            echo "$leaked"
            exit 1
          fi
          echo "$BIN links only the system runtime"

      - name: It runs, and says what it is
        if: ${{ !matrix.cross }}
        run: |
          set -euo pipefail
          # A binary that builds and cannot start is not an artefact. The
          # version line is what npm, Homebrew and the .deb check after
          # install, so it is checked here first.
          out=$("target/${{ matrix.target }}/release/$BIN" --version)
          echo "$out"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          case "$out" in
            "gh-pr-manager $version ("*) ;;
            *) echo "expected 'gh-pr-manager $version (<commit>, <date>)'" >&2; exit 1 ;;
          esac
          case "$out" in
            *unknown*|*dirty*)
              echo "the build stamp did not resolve cleanly" >&2; exit 1 ;;
          esac

      - name: A tarball, and its checksum
        run: |
          set -euo pipefail
          # On a tag this is v0.2.0; on a pull request it is "41/merge",
          # whose slash would become a directory. Anything that is not a
          # version is just called dev.
          case "${GITHUB_REF_NAME}" in
            v[0-9]*) version="${GITHUB_REF_NAME}" ;;
            *)       version="dev" ;;
          esac
          name="gh-pr-manager-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/$BIN" README.md LICENSE CHANGELOG.md "dist/$name/"
          tar -C dist -czf "$name.tar.gz" "$name"
          # Written by hand in one format on every OS: sha256sum on Windows
          # can mark binary mode with `*`, and shasum is not on every runner.
          if command -v sha256sum >/dev/null; then
            hash=$(sha256sum "$name.tar.gz" | cut -d' ' -f1)
          else
            hash=$(shasum -a 256 "$name.tar.gz" | cut -d' ' -f1)
          fi
          printf '%s  %s\n' "${hash#\\}" "$name.tar.gz" > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"

      - name: Debian package from the tagged Linux build
        if: matrix.target == 'x86_64-unknown-linux-gnu' && startsWith(github.ref, 'refs/tags/v')
        run: node debian/package.js "${GITHUB_REF_NAME#v}" target/x86_64-unknown-linux-gnu/release .

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.target }}
          path: |
            gh-pr-manager-*.tar.gz
            gh-pr-manager-*.tar.gz.sha256
            gh-pr-manager_*_amd64.deb
            gh-pr-manager_*_amd64.deb.sha256
          if-no-files-found: error

  debian-lifecycle:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'debian:12', 'debian:11']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: x86_64-unknown-linux-gnu
          path: artifacts
      - name: Verify and install the release package
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          (cd artifacts && sha256sum -c gh-pr-manager_*_amd64.deb.sha256)
          mode=supported
          if [ "$IMAGE" = debian:11 ]; then mode=old-glibc; fi
          docker run --rm -v "$PWD:/work:ro" "$IMAGE" \
            bash /work/debian/lifecycle.sh "/work/artifacts/gh-pr-manager_${GITHUB_REF_NAME#v}_amd64.deb" "$mode"

  publish:
    needs: [build, debian-lifecycle]
    runs-on: ubuntu-22.04
    # A tag, and only a tag - whatever started the run. Dispatching at a
    # branch exercises the whole build and stops here.
    if: startsWith(github.ref, 'refs/tags/v')
    # One tagged publish at a time. Untagged `npm publish` moves `latest`
    # in the same write, so two overlapping tagged runs could interleave
    # their packages and an older run finishing last would roll
    # `gh-pr-manager@latest` backwards. The group is shared across tags and
    # unique per run otherwise, because concurrency is joined before the
    # job-level `if`. refuse-stale-latest.js is the other half.
    concurrency:
      group: ${{ startsWith(github.ref, 'refs/tags/v') && 'npm-release-publish' || format('npm-release-publish-{0}', github.run_id) }}
      cancel-in-progress: false
    # Only publication needs contents: write. id-token is for npm trusted
    # publishing - OIDC, no secret.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Notes for this release
        run: |
          # The top section of CHANGELOG.md, which release-pr.yml wrote and
          # the release PR showed for review - the same text, character for
          # character, rather than a regeneration that could differ.
          awk '/^## \[/{n++} n==1' CHANGELOG.md > CHANGELOG-release.md
          if [ ! -s CHANGELOG-release.md ]; then
            echo "no section found in CHANGELOG.md for this release" >&2
            exit 1
          fi
          cat CHANGELOG-release.md

      # The npm packages are generated from the tarballs this run just
      # built, not maintained in git, so `npx gh-pr-manager@0.2.0` and
      # `v0.2.0` are the same binaries.
      #
      # npm first, then the GitHub release. Missing trusted-publisher setup
      # fails on the first package and leaves nothing on either side. The
      # publishes are not atomic, though: a later package can fail after
      # earlier ones landed - see docs/releasing.md before retrying.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          # Keep package caching disabled in the privileged OIDC publish job.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: npm that can do trusted publishing
        run: |
          # Node 22 ships npm 10.x. Trusted publishing's OIDC handshake
          # needs 11.5.1 or later.
          npm install -g npm@11.5.1
          test "$(npm --version)" = "11.5.1"

      - name: Pack the npm packages from those tarballs
        run: |
          set -euo pipefail
          node npm/pack.js --version "${GITHUB_REF_NAME#v}" --artifacts artifacts --out npm-dist
          ls -la npm-dist

      - name: Publish to npm
        run: |
          set -euo pipefail
          # Trusted publishing is the whole story: id-token: write plus
          # --provenance, and no secret anywhere in this workflow. Granular
          # npm write tokens expire after 90 days, which is a release-day
          # failure sitting quietly in the calendar.
          #
          # setup-node always writes _authToken=${NODE_AUTH_TOKEN} into
          # .npmrc, and any credential at all - an empty one included -
          # makes npm skip the OIDC exchange. This clears it.
          npm config delete '//registry.npmjs.org/:_authToken' || true
          npm config delete always-auth || true
          version="${GITHUB_REF_NAME#v}"
          # Refuse if latest already names a newer version on any package.
          node npm/refuse-stale-latest.js "$version"
          publish() {
            local dir="$1"
            local name published_sha
            name=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).name' "$dir/package.json")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              # Skip is for retrying the same commit. npm will not replace a
              # version, so one already published from a different SHA - or
              # one whose gitHead cannot be read - is frozen. Cut the next.
              published_sha=$(npm view "${name}@${version}" gitHead 2>/dev/null || true)
              published_sha=$(printf '%s' "$published_sha" | tr -d '[:space:]')
              if [[ ! "$published_sha" =~ ^[0-9a-f]{40}$ ]]; then
                echo "${name}@${version} is already on npm but gitHead is missing or unreadable; cannot prove it is ${GITHUB_SHA}. Cut the next version." >&2
                exit 1
              fi
              if [ "$published_sha" != "$GITHUB_SHA" ]; then
                echo "${name}@${version} is already on npm from ${published_sha}; this run is ${GITHUB_SHA}. Cut the next version." >&2
                exit 1
              fi
              echo "${name}@${version} is already on npm from this commit"
            else
              # `./` matters: a path with a slash and no ./ is GitHub
              # shorthand (owner/repo) to npm.
              #
              # No --tag, so this write creates the version and moves
              # `latest` at once. npm can take minutes to serve a new
              # version, and for those minutes `latest` names something npx
              # cannot fetch yet. opscope tried publishing under `next` and
              # promoting later, which then needed a stored token for
              # `npm dist-tag add` (npm/cli#8547). npm 11.21.0 can do that
              # over OIDC, but only once "Allow npm dist-tag" is ticked on
              # each of the six packages' trusted publishers (off by
              # default). With that done, pin npm 11.21.0 above, publish
              # with `--tag next` here and move `latest` in a job after
              # smoke-npm.
              npm publish "./$dir" --access public --provenance
            fi
          }
          # Platforms first: the launcher lists them as optionalDependencies
          # at this same version, and npm fetches them the moment it is
          # installed.
          for pkg in npm-dist/gh-pr-manager-*; do
            publish "$pkg"
          done
          publish npm-dist/gh-pr-manager

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la artifacts
          # A re-dispatch at the same tag is the ordinary way to finish a
          # release whose npm half landed and whose GitHub half did not, so
          # an existing *published* release is walked past. A draft is what
          # a half-finished upload leaves behind, and is a failure.
          draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft \
            --jq .isDraft 2>/dev/null || true)
          if [ "$draft" = "true" ]; then
            echo "a draft release for $GITHUB_REF_NAME is in the way; delete it and re-dispatch" >&2
            exit 1
          fi
          if [ "$draft" = "false" ]; then
            echo "$GITHUB_REF_NAME is already released; leaving it alone"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file CHANGELOG-release.md \
            artifacts/*.tar.gz artifacts/*.tar.gz.sha256 \
            artifacts/*_amd64.deb artifacts/*_amd64.deb.sha256

  apt-repository:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Notify the shared APT repository of this published release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.RELEASE_TOKEN }}
        run: node debian/notify-apt.js

  homebrew:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: read
    concurrency:
      group: ${{ startsWith(github.ref, 'refs/tags/v') && 'homebrew-tap-gh-pr-manager' || format('homebrew-tap-gh-pr-manager-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Generate and test the formula from the public release
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p homebrew-artifacts
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern '*apple-darwin.tar.gz*' --pattern '*linux-gnu.tar.gz*' \
            --dir homebrew-artifacts
          node homebrew/formula.js "$version" homebrew-artifacts homebrew/gh-pr-manager.rb
          brew tap stealth-factory/tap
          cp homebrew/gh-pr-manager.rb "$(brew --repo stealth-factory/tap)/Formula/gh-pr-manager.rb"
          brew install stealth-factory/tap/gh-pr-manager
          brew test stealth-factory/tap/gh-pr-manager

      - name: Update the shared Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set GH_TOKEN or RELEASE_TOKEN with Contents write access to stealth-factory/homebrew-tap"
            exit 1
          fi
          bash homebrew/update-tap.sh "${GITHUB_REF_NAME#v}" homebrew-artifacts

  # What a stranger with only Node gets, tried after the release exists.
  #
  # NOT A GATE. It runs after `publish`, which has already moved `latest`,
  # so it reports on a release rather than deciding it. A red run means
  # `npx gh-pr-manager@latest` points at something broken: fix forward by
  # cutting the next version. Do not unpublish.
  smoke-npm:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, windows-2022]
    runs-on: ${{ matrix.runs-on }}
    # No checkout: nothing here reads the repository.
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: npx fetches this version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # By version, not by tag: the question is whether the exact
          # version npm accepted is one npm can serve. npm can answer `npm
          # view` minutes before the tarball is reachable everywhere (four,
          # measured by opscope), so this retries for eight.
          for attempt in $(seq 1 16); do
            if said=$(npx -y "gh-pr-manager@${version}" --version 2>&1); then
              break
            fi
            echo "attempt ${attempt}: not yet installable"
            echo "$said"
            said=""
            sleep 30
          done
          if [ -z "${said:-}" ]; then
            echo "gh-pr-manager@${version} was still not installable from npm eight" >&2
            echo "minutes after publish: treat this as a release that did not land." >&2
            echo "latest already names it. Fix forward; do not unpublish." >&2
            exit 1
          fi
          echo "$said"
          # stderr is folded in, so an npx warning can precede the banner.
          got=$(printf '%s' "$said" | awk '/^gh-pr-manager / { print $2; exit }')
          if [ "$got" != "$version" ]; then
            echo "npx gave '${got}', this tag is ${version}" >&2
            exit 1
          fi
