# Builds and tests every pull request and every commit on main.
#
# Ported from opscope's ci.yml: Linux and macOS as there, plus Windows,
# because gh-pr-manager ships a Windows binary and the first compiler to
# see a change for a shipped platform should not be the release build.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A second push to a pull request cancels the first. Never on main: a run
# there is the only record that a commit was built and tested, so every
# commit that lands gets its own verdict.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          # The same exact version release.yml builds with. A pull request
          # that passes here and fails at release time on a compiler
          # difference is the one outcome this job exists to prevent.
          toolchain: "1.98.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Tests
        # Debug, not release: release.yml covers the release profile on
        # every platform; this is the fast gate.
        run: cargo test --all-targets

      - name: It builds
        run: cargo build --bins

      - name: The npm packages pack and fail clearly
        run: node --test npm/test.js

      - name: Homebrew formula generation and stale release protection
        run: node --test homebrew/test.js

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.98.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: macos

      - name: Tests
        run: cargo test --all-targets

      - name: It builds
        run: cargo build --bins

  windows:
    runs-on: windows-2022
    env:
      # aws-lc-sys (rustls's crypto) needs NASM for x86_64 Windows, which the
      # runner does not have; its prebuilt objects are the documented
      # alternative.
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.98.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows

      - name: Tests
        run: cargo test --all-targets

      - name: It builds
        run: cargo build --bins

  debian:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: debian
      - run: node --test debian/test.js
      - name: Build a manifest-version test package (never dev) and run its lifecycle
        run: |
          set -euo pipefail
          cargo build --locked --bins
          strip --strip-debug target/debug/gh-pr-manager
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          node debian/package.js "$version" target/debug debian-dist
          (cd debian-dist && sha256sum -c *.deb.sha256)
          dpkg-deb --info "debian-dist/gh-pr-manager_${version}_amd64.deb"
          for image in ubuntu:22.04 debian:12 debian:11; do
            mode=supported
            if [ "$image" = debian:11 ]; then mode=old-glibc; fi
            docker run --rm -v "$PWD:/work:ro" "$image" \
              bash /work/debian/lifecycle.sh "/work/debian-dist/gh-pr-manager_${version}_amd64.deb" "$mode"
          done
