[package]
name = "gh-pr-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
html2text = "0.17.3"
ratatui = "0.30"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
toml = "1.1.8"
unicode-width = "0.2.2"
